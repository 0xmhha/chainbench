# workspace-config.sample.yaml
# --workspace-config로 넘기는 환경 파일의 샘플이다(run, chain new/up,
# MCP chainbench_chain_new/chainbench_chain_up).
#
# 주석 처리되지 않은 아래 블록은 그대로 쓸 수 있다. 주석으로 적힌 블록은 선택
# 항목이며, 필요할 때 주석을 풀어 쓴다.
# 사용법 요약은 docs/guide/config-files.md를 본다.
#
# workspace-config.yaml 또는 workspace-config.local.yaml로 복사해 사용한다.
# 실제 환경 파일은 Git에서 제외한다. 저장소에는 이 샘플만 관리한다.
# 아래 /data 및 파일명은 설명용 값이다. 실제 서버 주소나 인증 정보는 넣지 않는다.
# 서버 목록, 슬롯, 포트, SSH 설정은 별도 server-set.yaml이 소유한다.
# 이 파일은 로컬의 chainbench가 읽지만, dataRoot와 paths는 실행 대상 머신의 경로다.

# 최상위 키: version, dataRoot, paths, binaryAliases, control, inputs, execution,
# limits, existingInputs. 이 밖의 키나 중복 키가 있으면 읽을 때 오류로 멈춘다(오타가
# 조용히 무시되지 않게). 필수는 version, dataRoot, paths, control.artifactRoot,
# inputs.mode, execution.chain 이다.

# 1 만 받는다. 다른 값은 추측해 읽지 않고 거부한다.
version: 1

# 실행 대상 머신의 절대경로. 원격이면 원격 서버 내부 경로다.
# 로컬 실행은 예를 들어 /Users/example/chainbench-data로 변경한다.
# 대상 경로에서는 ~, $VAR, ${VAR}, 상대 dataRoot를 허용하지 않는다.
# 서버별 루트가 다른 구성은 아래 문서의 후속 확장 항목으로 다룬다.
dataRoot: /data

# 모든 값은 dataRoot 기준 상대 디렉터리다. 아래 항목을 명시적으로 작성한다.
# 절대경로, .., 빈 값은 거부한다. 누락값을 현재 작업 디렉터리로 대체하지 않는다.
paths:
  # 실행 바이너리: DSL의 gwemix -> /data/bin/gwemix
  binaries: bin

  # 재사용할 config 원본. DSL의 config-wemix-test1.yml
  # -> /data/configs/config-wemix-test1.yml
  # 확장자만으로 형식을 변환하지 않는다. 바이너리별 지원 형식을 검증해야 한다.
  configs: configs

  # genesis 템플릿 또는 완성본 원본. DSL의 genesis-wemix-test.json
  # -> /data/genesis/genesis-wemix-test.json
  # 템플릿/완성본 여부는 DSL이 선언한다. 경로 설정으로 결정하지 않는다.
  genesis: genesis

  # 개별 계정 keystore 파일 원본. DSL 참조 bp1/account.json
  # -> /data/keystore/bp1/account.json
  # password나 private key 원문은 이 파일에 작성하지 않는다.
  keystore: keystore

  # 기존 keyring/preset 전체 디렉터리 원본. keystore 파일 한 개와 구분한다.
  # DSL의 preset-a -> /data/keys/preset-a
  # source=generate인 새 키는 공유 원본 대신 구성별 runtime 아래에 생성한다.
  keyrings: keys

  # 변경되는 노드 DB: /data/node/<compositionId>/<nodeId>
  # 바이너리 교체/재시작 때 유지한다. 같은 바이너리의 여러 노드는 서로 격리한다.
  nodes: node

  # 생성 또는 배포한 실행용 genesis, 노드별 config, 생성 키, 생성기 작업 파일.
  # /data/runtime/<compositionId>/ 아래에 소유권을 기록하고 배치한다.
  # configs/genesis/keystore/keyrings의 공유 원본은 덮어쓰지 않는다.
  runtime: runtime

  # /data/logs/<compositionId>/<nodeId>/<attemptId>.log
  # 재시작 전 로그를 보존하고, 로컬 세션 결과로 수집한다.
  logs: logs

# DSL이나 --binary가 bare 이름(gwemix)으로 가리킨 바이너리는 대상의
# dataRoot/paths.binaries 아래에서 찾는다(/data/bin/gwemix). 이 블록은 그 이름을
# 환경별 실제 파일명에 대응시키며, 값은 paths.binaries 기준 상대경로다. 키가
# 없으면 이름을 그대로 쓰고, 절대경로 참조에는 적용하지 않는다. 값에도 paths 와 같은
# 규칙이 걸린다 — 절대경로, .., ~, $VAR, 빈 값은 거부한다. 같은 논리 이름이라도
# 체인 기능/아키텍처/버전 호환 여부는 사전 검사해야 한다.
# binaryAliases:
#   gwemix: linux-amd64/gwemix
#   gwbft: release-candidate/gwbft

# 로컬 제어 영역. 이 블록만 chainbench를 실행하는 머신의 경로다.
control:
  # 필수. 로컬에서 ~를 확장한다. 상대경로를 쓴다면 이 설정 파일의 디렉터리가 기준이다.
  # <artifactRoot>/<날짜시간>/<테스트이름>/ 아래에 결과와 수집 로그를 저장한다.
  # 최종 report는 <artifactRoot>/<날짜시간>/ 바로 아래에 생성한다.
  artifactRoot: ~/.chainbench

  # 원격 대상에 줄 노드 바이너리가 있는 로컬 디렉터리. 파일 이름은 대상이 실행하는
  # 이름(체인 매니페스트의 binary, 또는 binaryAliases 값)과 같아야 한다. deploy
  # 단계가 대상의 사본이 없거나 sha256 이 다를 때만 여기서 보낸다. 비우면 지금처럼
  # 대상이 바이너리를 미리 갖고 있어야 한다. ~ 와 상대경로는 artifactRoot 와 같이 푼다.
  # binaries: ~/cbbin

# 입력 준비 방식. mode 는 generated 또는 existing 이다.
# generated는 키와 genesis/config를 Builder로 준비한다. 이때 name 을 적으면 거부한다.
# 바이너리 자체를 빌드하거나 다운로드하는 옵션이 아니다.
# 노드 수와 역할은 DSL/Blueprint에서 지정한다.
inputs:
  mode: generated

# fresh는 새 구성 ID와 격리된 DB/포트를 사용한다.
# 이미 실행 중인 다른 중요 테스트의 프로세스나 DB를 지우지 않는다.
# 대안: reuse-if-matching(구성·입력·배포·건강 상태 일치 시), attach(기존 체인 검사만).
execution:
  chain: fresh

# genesis 를 쓰기 전(대상에 처음 쓰는 시점)에 노드가 놓일 모든 서버에서 dataRoot 의 여유 공간을
# 확인한다. 이보다 적으면 구성을 시작하지 않는다. 비우면 2GiB, "0" 이면 검사하지 않는다.
# 값은 바이트 수 또는 B·KiB·MiB·GiB·TiB 접미사다(KB·MB·GB·TB 도 같은 이진 단위로 읽는다).
# limits:
#   minFreeDisk: 2GiB

# 대상에 이미 있는 입력을 쓰려면 위 inputs 블록을 아래 블록으로 교체한다.
# inputs 키를 두 번 작성하지 않는다. existing에서는 name이 필수이고, 그 이름이
# existingInputs 에 있어야 한다. 파일이 없으면 오류로 종료하며 generated로 자동
# 전환하지 않는다.
#
# existingInputs.<이름> 의 키는 genesis, keyring, configs 셋이며 모두 선택이다.
#   genesis   완성된 genesis 파일. 그대로 쓴다. DSL 도 genesis 를 선언하면 충돌로 거부한다.
#   keyring   키셋 디렉터리. DSL 도 keys 를 선언하면 충돌로 거부한다.
#   configs   <논리 이름>: <파일> 의 맵. DSL 노드표의 config 값이 이 맵의 키와 같으면
#             그 노드의 config 를 오른쪽 파일로 바꾼다. 키가 아닌 값은 파일 참조로 그대로
#             쓴다. 아래의 default 는 노드가 config: default 라고 적었을 때만 쓰인다.
# inputs:
#   mode: existing
#   name: regression
#
# existingInputs:
#   regression:
#     genesis: srv://server-01/data/genesis/genesis-wemix-regression.json
#     keyring: srv://server-01/data/keys/regression-keys
#     configs:
#       default: srv://server-01/data/configs/config-wemix-regression.toml
#
# srv://server-01/data/...는 server-set에서 name이 server-01인 서버의 /data/...다.
# dataRoot를 다시 붙이지 않는다. server-01은 목록 순서가 아닌 고정 이름이다.
# 원본 파일 위치를 지정하는 것이며 노드 배치나 개인 키 전송을 지시하지 않는다.
# 모든 노드가 다른 서버에 있으면 원본/목적지와 배포 정책을 별도로 검증한다.
#
# existingInputs의 참조로 쓸 수 있는 것은 문자열 세 형식이다. 다른 형식은 없다.
#
#   srv://<서버이름>/<절대경로>   지정한 서버의 그 경로 (dataRoot를 덧붙이지 않는다)
#   <상대 파일명>                대상의 용도별 디렉터리 아래 (genesis·configs 만)
#   /<절대경로>                  chainbench 를 돌리는 이 기계의 파일
#
# keyring 은 srv:// 또는 절대경로만 받는다. 상대 이름은 로컬 디렉터리로 오인하지 않도록
# 거부한다. srv:// 키링은 keys 단계가 로컬로 내려받아 쓴다.
#
# 예전 이 자리에는 객체형 참조({server, ref} / {serverIndex, ref} / {localPath})가
# "미구현"이라는 딱지와 함께 예시로 적혀 있었다. 2026-09-12에 그 계획을 철회했다.
# 이유는 표현력이 아니라 값이다 — srv://와 상대 파일명이 실제로 쓰이는 경우를 모두
# 덮고 있고, 객체형을 이 묶음에서 끝까지 나르려면 KeysDir/GenesisExisting이 문자열인
# 32개 파일 105곳을 구조체로 바꿔야 하는데 그 표현력을 요구하는 호출자가 없다.
# 포기한 것은 serverIndex 하나다: 서버를 이름이 아니라 순번으로 고르는 것은 문자열로
# 표현할 수 없다. 필요해지면 그때 요구와 함께 다시 연다.

# 구성 ID, 노드 ID, 실행 시각, PID, 실제 명령어, 체크섬은 운영자가 입력하지 않는다.
# chainbench가 생성하여 기존 chain-record.json 및 실행 기록에 저장한다.
# 바이너리 다운로드/업로드 정책과 로컬 원본 경로는 별도 배포 계약으로 설계한다.
# 이 샘플의 경로 선언만으로 자동 전송을 의미하지 않는다.
