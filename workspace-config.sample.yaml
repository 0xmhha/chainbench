# workspace-config.sample.yaml
# Sample of the environment file passed with --workspace-config (run, chain
# new/up, MCP chainbench_chain_new/chainbench_chain_up).
#
# The uncommented blocks below work as they are. The commented blocks are
# optional: uncomment one when you need it.
# For a usage summary see docs/guide/config-files.md.
#
# Copy this to workspace-config.yaml or workspace-config.local.yaml. Real
# environment files stay out of Git; only this sample is tracked.
# The /data paths and file names below are illustrative. Do not put real server
# addresses or credentials here.
# The server list, slots, ports and SSH settings belong to server-set.yaml.
# chainbench reads this file locally, but dataRoot and paths are paths on the
# machine that runs the nodes.

# Top-level keys: version, dataRoot, paths, binaryAliases, control, inputs,
# execution, limits, existingInputs. Any other key, or a duplicate key, stops
# the load with an error, so a typo is never silently ignored. Required:
# version, dataRoot, paths, control.artifactRoot, inputs.mode, execution.chain.

# Only 1 is accepted. Any other value is rejected rather than guessed at.
version: 1

# Absolute path on the target machine. For a remote target this is a path
# inside the remote server.
# For a local run change it to something like /Users/example/chainbench-data.
# Target paths may not use ~, $VAR, ${VAR}, or a relative dataRoot.
# Per-server roots are a follow-up extension, covered in the doc above.
dataRoot: /data

# Every value is a directory relative to dataRoot. Write each entry out
# explicitly. Absolute paths, .., and empty values are rejected. A missing
# value is not filled in from the current working directory.
paths:
  # Node binaries: gwemix in the DSL -> /data/bin/gwemix
  binaries: bin

  # Reusable config sources. config-wemix-test1.yml in the DSL
  # -> /data/configs/config-wemix-test1.yml
  # The extension alone does not convert the format. Check which formats the
  # binary in question supports.
  configs: configs

  # Genesis sources, template or finished. genesis-wemix-test.json in the DSL
  # -> /data/genesis/genesis-wemix-test.json
  # Whether a file is a template or a finished genesis is declared in the DSL,
  # not decided by this path setting.
  genesis: genesis

  # Sources for individual account keystore files. bp1/account.json in the DSL
  # -> /data/keystore/bp1/account.json
  # Never write a password or a raw private key into this file.
  keystore: keystore

  # Sources for a whole existing keyring or preset directory, as opposed to a
  # single keystore file. preset-a in the DSL -> /data/keys/preset-a
  # New keys with source=generate are created under the per-composition runtime
  # directory instead of this shared source tree.
  keyrings: keys

  # Mutable node databases: /data/node/<compositionId>/<nodeId>
  # Kept across a binary swap or a restart. Several nodes of the same binary
  # stay isolated from each other.
  nodes: node

  # Generated or deployed runtime genesis, per-node configs, generated keys and
  # builder work files. Placed under /data/runtime/<compositionId>/ with their
  # ownership recorded.
  # The shared sources under configs/genesis/keystore/keyrings are not
  # overwritten.
  runtime: runtime

  # /data/logs/<compositionId>/<nodeId>/<attemptId>.log
  # Logs survive a restart and are collected into the local session results.
  logs: logs

# A binary that the DSL or --binary names bare (gwemix) is looked up under the
# target's dataRoot/paths.binaries (/data/bin/gwemix). This block maps that
# name to the real file name in this environment; values are relative to
# paths.binaries. A name with no entry is used as written, and the mapping does
# not apply to absolute-path references. Values follow the same rules as paths:
# absolute paths, .., ~, $VAR and empty values are rejected. Mapping a logical
# name does not check that the binary matches the chain's features,
# architecture or version — verify that yourself.
# binaryAliases:
#   gwemix: linux-amd64/gwemix
#   gwbft: release-candidate/gwbft

# The local control area. This block alone holds paths on the machine that runs
# chainbench.
control:
  # Required. ~ is expanded locally. A relative path resolves against the
  # directory of this config file.
  # Results and collected logs are stored under
  # <artifactRoot>/<timestamp>/<test name>/.
  # The final report is written directly under <artifactRoot>/<timestamp>/.
  artifactRoot: ~/.chainbench

  # Local directory holding the node binaries to hand to a remote target. Each
  # file name must match the name the target runs (the chain manifest's binary,
  # or a binaryAliases value). The deploy step sends a file from here only when
  # the target has no copy or its sha256 differs. Leave it unset and the target
  # must already have the binaries, as it does today. ~ and relative paths
  # resolve the same way as artifactRoot.
  # binaries: ~/cbbin

# How inputs are prepared. mode is either generated or existing.
# generated prepares keys and genesis/config with the Builder. Writing a name
# alongside it is rejected.
# This is not an option for building or downloading the binaries themselves.
# Node count and roles come from the DSL/Blueprint.
inputs:
  mode: generated

# fresh takes a new composition ID and isolated databases and ports.
# It never removes the processes or databases of another test already running.
# Alternatives: reuse-if-matching (when composition, inputs, deployment and
# health all match) and attach (inspect an existing chain only).
execution:
  chain: fresh

# Before genesis is written (the first write to the target), free space under
# dataRoot is checked on every server that will host a node. Less than this and
# the composition does not start. Unset means 2GiB; "0" disables the check.
# The value is a byte count or carries a B/KiB/MiB/GiB/TiB suffix (KB/MB/GB/TB
# are read as the same binary units).
# limits:
#   minFreeDisk: 2GiB

# To use inputs that already exist on the target, replace the inputs block
# above with the block below. Do not write the inputs key twice. With existing,
# name is required and must appear in existingInputs. A missing file is a fatal
# error; it does not fall back to generated.
#
# existingInputs.<name> takes three optional keys: genesis, keyring, configs.
#   genesis   A finished genesis file, used as is. If the DSL also declares a
#             genesis, the conflict is rejected.
#   keyring   A keyset directory. If the DSL also declares keys, the conflict
#             is rejected.
#   configs   A map of <logical name>: <file>. When a node's config value in
#             the DSL node table equals a key of this map, that node's config
#             is replaced by the file on the right. A value that is not a key
#             is used as a file reference as written. The default below applies
#             only to a node that wrote config: default.
# inputs:
#   mode: existing
#   name: regression
#
# existingInputs:
#   regression:
#     genesis: srv://server-01/data/genesis/genesis-wemix-regression.json
#     keyring: srv://server-01/data/keys/regression-keys
#     configs:
#       default: srv://server-01/data/configs/config-wemix-regression.toml
#
# srv://server-01/data/... means /data/... on the server whose name in the
# server set is server-01. dataRoot is not prepended again. server-01 is a
# fixed name, not a position in the list.
# A reference states where the source file lives. It does not place nodes and
# does not direct any private key to be transferred.
# When nodes sit on several servers, verify source, destination and deployment
# policy separately.
#
# An existingInputs reference is one of exactly three string forms:
#
#   srv://<server name>/<absolute path>  that path on the named server
#                                        (dataRoot is not prepended)
#   <relative file name>                 under the target's directory for that
#                                        purpose (genesis and configs only)
#   /<absolute path>                     a file on the machine running
#                                        chainbench
#
# keyring accepts only srv:// or an absolute path. A relative name is rejected
# so it cannot be mistaken for a local directory. A srv:// keyring is
# downloaded locally by the keys step.
#
# Object-shaped references ({server, ref}, {serverIndex, ref}, {localPath}) are
# not supported and are not planned. The one thing they could express and these
# strings cannot is serverIndex, picking a server by position rather than by
# name; reopen that if a caller ever needs it.

# Composition IDs, node IDs, run times, PIDs, the actual command lines and
# checksums are not entered by an operator. chainbench generates them and
# stores them in chain-record.json and the run records.
# Binary download/upload policy and local source paths are designed as a
# separate deployment contract. Declaring a path in this sample does not by
# itself mean anything is transferred automatically.
