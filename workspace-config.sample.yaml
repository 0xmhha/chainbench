# workspace-config.sample.yaml
# --workspace-config로 넘기는 환경 파일의 샘플이다(run, chain new/up,
# MCP net_new/net_up).
#
# 주석 처리되지 않은 아래 블록이 지금 동작하는 범위다. 주석으로만 적힌 예시는
# 아직 동작하지 않으며, 각 자리에 무엇이 미구현인지 표시해 두었다. 주석을 풀면
# 파일이 로드되지 않거나 값이 무시되므로, 표시를 확인하고 사용한다.
# 사용법 요약은 docs/dev/config-files-guide.md를 본다.
#
# workspace-config.yaml 또는 workspace-config.local.yaml로 복사해 사용한다.
# 실제 환경 파일은 Git에서 제외한다. 저장소에는 이 샘플만 관리한다.
# 아래 /data 및 파일명은 설명용 값이다. 실제 서버 주소나 인증 정보는 넣지 않는다.
# 서버 목록, 슬롯, 포트, SSH 설정은 별도 server-set.yaml이 소유한다.
# 이 파일은 로컬의 chainbench가 읽지만, dataRoot와 paths는 실행 대상 머신의 경로다.

version: 1

# 실행 대상 머신의 절대경로. 원격이면 원격 서버 내부 경로다.
# 로컬 실행은 예를 들어 /Users/example/chainbench-data로 변경한다.
# 대상 경로에서는 ~, $VAR, ${VAR}, 상대 dataRoot를 허용하지 않는다.
# 서버별 루트가 다른 구성은 아래 문서의 후속 확장 항목으로 다룬다.
dataRoot: /data

# 모든 값은 dataRoot 기준 상대 디렉터리다. 아래 항목을 명시적으로 작성한다.
# 절대경로, .., 빈 값은 거부한다. 누락값을 현재 작업 디렉터리로 대체하지 않는다.
paths:
  # 실행 바이너리: DSL의 gwemix -> /data/bin/gwemix
  binaries: bin

  # 재사용할 config 원본. DSL의 config-wemix-test1.yml
  # -> /data/configs/config-wemix-test1.yml
  # 확장자만으로 형식을 변환하지 않는다. 바이너리별 지원 형식을 검증해야 한다.
  configs: configs

  # genesis 템플릿 또는 완성본 원본. DSL의 genesis-wemix-test.json
  # -> /data/genesis/genesis-wemix-test.json
  # 템플릿/완성본 여부는 DSL이 선언한다. 경로 설정으로 결정하지 않는다.
  genesis: genesis

  # 개별 계정 keystore 파일 원본. DSL 참조 bp1/account.json
  # -> /data/keystore/bp1/account.json
  # password나 private key 원문은 이 파일에 작성하지 않는다.
  keystore: keystore

  # 기존 keyring/preset 전체 디렉터리 원본. keystore 파일 한 개와 구분한다.
  # DSL의 preset-a -> /data/keys/preset-a
  # source=generate인 새 키는 공유 원본 대신 구성별 runtime 아래에 생성한다.
  keyrings: keys

  # 변경되는 노드 DB: /data/node/<compositionId>/<nodeId>
  # 바이너리 교체/재시작 때 유지한다. 같은 바이너리의 여러 노드는 서로 격리한다.
  nodes: node

  # 생성 또는 배포한 실행용 genesis, 노드별 config, 생성 키, 생성기 작업 파일.
  # /data/runtime/<compositionId>/ 아래에 소유권을 기록하고 배치한다.
  # configs/genesis/keystore/keyrings의 공유 원본은 덮어쓰지 않는다.
  runtime: runtime

  # /data/logs/<compositionId>/<nodeId>/<attemptId>.log
  # 재시작 전 로그를 보존하고, 로컬 세션 결과로 수집한다.
  logs: logs

# 미구현: 이 블록은 파싱되고 검증도 받지만 아직 아무도 읽지 않는다.
# 대응 관계를 적용하는 함수(BinaryPath)에 테스트 말고는 호출처가 없어서,
# 여기에 별칭을 적어도 실제 실행 경로는 DSL이 쓴 이름을 그대로 쓴다.
#
# 붙일 때의 의미는 이렇다: 같은 DSL 바이너리 이름을 환경별 실제 파일명에
# 대응시키며, 값은 paths.binaries 기준 상대경로다. 키가 없으면 DSL 참조를
# 그대로 쓴다. 같은 논리 이름이라도 체인 기능/아키텍처/버전 호환 여부는
# 사전 검사해야 한다.
# binaryAliases:
#   gwemix: linux-amd64/gwemix
#   gwbft: release-candidate/gwbft

# 로컬 제어 영역. 이 블록만 chainbench를 실행하는 머신의 경로다.
control:
  # 로컬에서 ~를 확장한다. 상대경로를 쓴다면 이 설정 파일의 디렉터리가 기준이다.
  # <artifactRoot>/<날짜시간>/<테스트이름>/ 아래에 결과와 수집 로그를 저장한다.
  # 최종 report는 <artifactRoot>/<날짜시간>/ 바로 아래에 생성한다.
  artifactRoot: ~/.chainbench

# 입력 준비 방식. generated는 키와 genesis/config를 Builder로 준비한다.
# 바이너리 자체를 빌드하거나 다운로드하는 옵션이 아니다.
# 노드 수와 역할은 DSL/Blueprint에서 지정한다.
inputs:
  mode: generated

# fresh는 새 구성 ID와 격리된 DB/포트를 사용한다.
# 이미 실행 중인 다른 중요 테스트의 프로세스나 DB를 지우지 않는다.
# 대안: reuse-if-matching(구성·입력·배포·건강 상태 일치 시), attach(기존 체인 검사만).
execution:
  chain: fresh

# 이미 준비된 입력을 쓰려면 위 inputs 블록을 아래 블록으로 교체한다.
# inputs 키를 두 번 작성하지 않는다. prepared에서는 preset이 필수다.
# 파일이 없으면 오류로 종료하며 generated로 자동 전환하지 않는다.
# inputs:
#   mode: prepared
#   preset: regression
#
# presets:
#   regression:
#     genesis: srv://server-01/data/genesis/genesis-wemix-regression.json
#     keyring: srv://server-01/data/keys/regression-keys
#     configs:
#       default: srv://server-01/data/configs/config-wemix-regression.toml
#
# srv://server-01/data/...는 server-set에서 name이 server-01인 서버의 /data/...다.
# dataRoot를 다시 붙이지 않는다. server-01은 목록 순서가 아닌 고정 이름이다.
# 원본 파일 위치를 지정하는 것이며 노드 배치나 개인 키 전송을 지시하지 않는다.
# 모든 노드가 다른 서버에 있으면 원본/목적지와 배포 정책을 별도로 검증한다.
#
# 미구현: 아래 객체형 참조는 셋 다 파싱되지 않는다. preset의 genesis/keyring은
# 문자열이고 configs는 문자열 맵이라, 자리에 맵을 적으면 파일 전체가
# "cannot unmarshal !!map into string"으로 로드에 실패한다. 지금 쓸 수 있는
# 참조는 위의 srv:// 문자열과 평범한 상대 파일명뿐이다.
#
# 붙일 때의 의미는 이렇다.
#
# 절대경로 대신 root + 용도별 디렉터리 조합:
# genesis:
#   server: server-01
#   ref: genesis-wemix-regression.json
#
# 번호로 고를 때는 server 대신 serverIndex: 1을 쓴다(1-based).
# 번호는 현재 server-set 순서다. 최초 해석한 서버 이름을 기록하고 resume 때 유지한다.
# srv://1/...는 기존 의미인 이름 "1"을 유지하며 번호 1로 재해석하지 않는다.
#
# 로컬 원본을 명시할 때: genesis: {localPath: /private/chainbench/fixtures/base.json}
# 상대 localPath는 이 환경 파일의 디렉터리가 기준이다.
# bare 파일명은 대상의 용도별 디렉터리에서 찾으며 로컬로 자동 대체하지 않는다.

# 구성 ID, 노드 ID, 실행 시각, PID, 실제 명령어, 체크섬은 운영자가 입력하지 않는다.
# chainbench가 생성하여 기존 workspace.json 및 실행 기록에 저장한다.
# 바이너리 다운로드/업로드 정책과 로컬 원본 경로는 별도 배포 계약으로 설계한다.
# 이 샘플의 경로 선언만으로 자동 전송을 의미하지 않는다.
