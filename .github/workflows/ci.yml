name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Gate: no secrets may enter the repo (runs the secret scanner over the tree).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: bash scripts/check-secrets.sh --all

  # Gate: shell scripts must parse. The tests/repro live-verification harness
  # can't run in CI (no chain binaries), so a syntax check is the only automated
  # guard against a broken script reaching main and failing only in a real env.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (shell syntax)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(find scripts tests -name '*.sh' -print0)
          [ "$fail" -eq 0 ]

  # Build, vet, format check, and the full test suite (the gated e2e tests skip
  # without their env, so they do not run here).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal tests)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race ./...

  # Static analysis beyond go vet: staticcheck, ineffassign, unused, errcheck
  # (config + exclusions in .golangci.yml).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # The version is read from .golangci-version rather than written here, so
      # `make lint` and this job cannot disagree about which linter is the
      # authority. An older one reports findings the pinned one does not.
      #
      # This job downloads the upstream release binary rather than building it.
      # That binary must itself have been compiled with Go >= go.mod's target,
      # because the linter parses our source: one built with an older Go cannot
      # read language features from a newer one. v2.12.2 is built with go1.26
      # and clears 1.25 comfortably. (Our code still targets 1.25 — see
      # setup-go above; a local `make lint` builds the linter from source with
      # whatever toolchain is installed.)
      - name: Read the pinned linter version
        id: linter
        run: echo "version=$(cat .golangci-version)" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ steps.linter.outputs.version }}
