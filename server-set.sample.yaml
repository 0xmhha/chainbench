# server-set.sample.yaml — server set template (v2)
#
# Copy to `server-set.yaml` (gitignored) and fill in real values.
# NEVER commit the real file. Host addresses, port assignments, and credentials
# are site-specific and sensitive; only this template is tracked.
#
#   cp server-set.sample.yaml server-set.yaml
#
# The file declares a POOL of resources, not a list of servers: the addresses
# chainbench may use and how many port slots each may hold. The allocator
# consumes hosts before slots, so with five addresses and four slots, node1..5
# land on distinct machines and node6 returns to the first on the next slot.
# A one-host pool with several slots is this machine running a whole network;
# a many-host pool with one slot each is a fleet. They are the same grid.
#
# With no config file at all, chainbench uses built-in ports and says so, so
# where a port came from is never a guess.

version: 2

pool:
  # Addresses in the order they are consumed. A bare address is named by
  # itself; a named entry can also be referenced as srv://<name>/path.
  #
  # A loopback address runs nodes on this machine and never dials SSH.
  # Anything else is reached over ssh: below — the address decides, so the file
  # cannot say "local" next to a remote IP and be believed.
  hosts:
    - { name: local, addr: 127.0.0.1 }
    # - { name: bp1, addr: 10.0.0.11 }
    # - 10.0.0.12

  # How many port slots one host may hold — i.e. how many nodes can share an
  # address. Defaults to 1.
  slots: 8

  # The two disjoint bands a slot draws from. Omit either to take the built-in
  # values (p2p 31000/10, rpc 8600/10).
  #
  #   p2p.step >= 2   the wemix binary derives its etcd port as p2p+1, so a
  #                   step of 1 makes etcd collide with the next slot's p2p
  #                   and block production stalls with no obvious cause.
  #   rpc.step >= 3   http, ws (http+1), auth (http+2). A step of 4 or more
  #                   also buys the metrics endpoint (http+3).
  ports:
    p2p: { base: 31000, step: 10 }
    rpc: { base: 8600, step: 10 }

# How every non-loopback host in the pool is reached.
#
# This file is the single source for a named server's login — the environment
# is never consulted, so a variable left over from another environment cannot
# silently redirect a dial. To keep the secret itself out of this file, point
# password_file (or key_passphrase_file) at a separate one-line file, 0600 —
# the shape a secret manager renders to disk.
#
# Host key policy is separate:
#   CHAINBENCH_SSH_KNOWN_HOSTS, or CHAINBENCH_SSH_INSECURE_HOST_KEY=1 on a
#   closed network with no known_hosts.
ssh:
  port: 22
  # user: chainbench
  # key_file: ~/.ssh/id_ed25519
  # password: ...             # or reference a secret file instead:
  # password_file: /etc/chainbench/ssh-pass   # one line, 0600

  # Whether the login may elevate. It is carried, not consumed: the bring-up
  # decides whether a step needs it.
  sudo: false

# Where a node's data plane lives ON the target (datadirs, genesis, configs,
# logs). A remote host's path is a path on that host. Node directories are
# created underneath it.
dataRoot: /var/lib/chainbench
