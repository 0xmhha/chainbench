# Secret-scanning configuration for chainbench.
#
# Every rule of the default set stays on. The allowlist below covers the places
# README.md declares to be test fixtures, plus the vendored snapshots named at
# the end, and nothing else:
#
#   > Treat a finding as real only if it is outside `presets/keys/` and outside
#   > test code.
#
# The keys under presets/keys/ are committed on purpose so a local run is
# reproducible. They are decryptable, every node binds to 127.0.0.1, and README
# states they must never be used on any production, mainnet, testnet, staging or
# shared network. The inline keys in test source are the upstream go-ethereum
# test keys, already public in every geth fork.
#
# That covers both kinds of key under presets/keys/: the node identities, which
# were generated once and committed, and the dev accounts (presets/keys/dev1/),
# which the harness mints at run time and reads back so a label keeps naming one
# address. Both are plaintext, both are disposable, and neither may ever hold
# anything on a real network.
#
# Two of the paths no longer exist in the tree. They are listed because the
# history scan still reaches them: `network/` was an earlier binary and
# `docs/superpowers/plans/` held planning notes that quoted test keys.
#
# Do NOT widen this list to silence a finding. A finding anywhere else is real.

[extend]
useDefault = true

[[allowlists]]
description = "committed test fixtures under presets/keys (README CAUTION)"
paths = ['''^presets/keys/''']

[[allowlists]]
description = "inline test keys in Go test source (upstream go-ethereum test keys)"
paths = ['''_test\.go$''']

[[allowlists]]
description = "test suites and their fixtures"
paths = ['''^tests/''']

[[allowlists]]
description = "retired paths reachable only through git history"
paths = ['''^network/''', '''^docs/superpowers/plans/''', '''^keys/preset/''']

[[allowlists]]
# docs/research/ holds chain repositories checked in whole so an analysis can be
# re-read against the tree it was made from. What the scanner finds there is
# upstream go-ethereum test data and clef tutorials — public in every fork — and
# it finds 1,036 of them, which is enough to teach a reader to ignore the
# scanner. That is the risk this entry removes.
#
# TEMPORARY. These snapshots come out of the repository once the refactoring
# that reads them is done, and this entry goes with them. It is the only entry
# here that covers code this project did not write.
description = "vendored chain sources kept for analysis; removed when the refactoring closes"
paths = ['''^docs/research/''']
