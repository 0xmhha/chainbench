ontology_schema:
  name: SessionSettledContract
  description: 확정 인터뷰의 요구를 유지하는 Web 도메인 계약. 최초 생성의 SessionSettledContract 이름은 유지하고 사용자 승인 보강으로 모델·관계·소유자를 연결한다.
    상세 필드는 동작 명세/OpenAPI, 검증 증거는 web-ui-acceptance.md가 소유한다.
  fields:
  - name: EngineContract
    type: object
    description: DSL parser/schema·등록된 동작/단언/reader·registry/resource/nodeconfig가 소유하는 grammar·인자·required/default/enum/range·참조·prerequisite와
      contractVersion. OpenAPI JsonSchema/Vocabulary를 통해 폼과 서버 검증이 공유한다.
    required: true
  - name: ChainSurface
    type: object
    description: chainId·dialect·문서 커밋/시각/digest·binary fingerprint·명령/옵션별 mapping/schema/지원 이유. 전체 binary
      표면과 실행 가능한 엔진 범위를 구분하며 stale 검증과 plan fingerprint를 연결한다. OpenAPI ChainSurface/ChainSurfaceRef.
    required: true
  - name: User
    type: object
    description: id·role·active로 권한과 작업 실행자를 식별한다. 관리자/운영자/조회자; 개인/팀 모두 로그인하며 계정 철회는 후속 권한·작업에 반영한다. OpenAPI
      User/Session.
    required: true
  - name: Credential
    type: object
    description: ownerId로 비공개 SSH binding을 식별하며 encrypted material은 API/export에 반환하지 않는다. 본인 접근만 허용하고 철회 시
      관련 Job 취소·노드 보존·후속 사용 차단. OpenAPI Credential/Create.
    required: true
  - name: Asset
    type: object
    description: id·kind·checksum·체인/플랫폼 compatibility로 파일/바이너리를 참조한다. 두 gwemix 정체성 구분과 ChainSurface 증거 검증.
      공유 파일과 개인 비밀 material을 구분한다. OpenAPI Asset.
    required: true
  - name: Document
    type: object
    description: id·kind·불변 revision·contractVersion·assetRefs의 팀 공유 선언. 엔진 schema를 재정의하지 않으며 If-Match/import/export
      의미 보존, private credential overlay 분리를 요구한다. OpenAPI Document/DocumentRef.
    required: true
  - name: Workspace
    type: object
    description: id·문서 revision·서버 배치의 공유 실행 환경. 별칭이 달라도 실제 자원은 ResourceLock의 canonical identity로 판정한다. OpenAPI
      Workspace.
    required: true
  - name: Network
    type: object
    description: id·workspaceId·owned/attached·node observations. 엔진 소유권/capability를 제어의 전제로 사용하며 attach 노드
      제어/정리를 거절한다. OpenAPI Network.
    required: true
  - name: Node
    type: object
    description: id·networkId·role·hostIdentity·dataPath·ports·PID/state·supportedControls. 실제 관측과 선언 구분; 허용
      reset 후 stopped, 교체/시작/정지는 실제 결과 확인. OpenAPI Node.
    required: true
  - name: Plan
    type: object
    description: actorId·operation·Document revisions·targetFingerprint·chainSurfaces·expiry·영향 단계/자원. 접근/소유/계약을
      검사하고 변경되면 재검증한다. 비밀 material은 포함하지 않는다. OpenAPI Plan.
    required: true
  - name: Job
    type: object
    description: Plan에서 고정한 작업과 실행자·credential 참조·state/phases·retention·cancelReason·partialEffects·nodeDisposition.
      accepted는 영속화/잠금 확보, 로그아웃 지속, 서버 재시작 interrupted, 자동 재실행 없음. OpenAPI Job.
    required: true
  - name: ResourceLock
    type: object
    description: canonical 실제 host·node/process·data path·port footprint와 jobId. workspace 별칭에 독립적으로 충돌 차단,
      독립 자원만 병행, 자동 대기열 없음. 동작 명세의 잠금 계약과 Plan.resources.
    required: true
  - name: Run
    type: object
    description: jobId·engine sessionRefs·summary·fingerprints·archive refs로 과거 결과를 연결한다. 검색/호환 비교/export,
      수집 자료 무기한 보관, terminal 관리자 삭제는 해당 실행의 독점 소유 자료만 제거한다. OpenAPI Run.
    required: true
  - name: Observation
    type: object
    description: snapshot version·SSE cursor·시간/노드·metric 단위/출처·로그·coverage/gaps/downsample/stale. 전역 bus drop과
      사용자 stream 누락 구분, snapshot 복원과 시점 연계. OpenAPI Snapshot/Metrics/Logs/Coverage.
    required: true
  - name: AuditRecord
    type: object
    description: actor·operation·target·request/job·result·time의 비밀 제거 변경/거절/취소/삭제 기록. 히스토리 삭제로 감사 기록을 지우지
      않는다. OpenAPI AuditRecord.
    required: true
  - name: AcceptanceEvidence
    type: object
    description: WEB ID·invocation·필수/실행/skip 시나리오·관측 assertion·실제 server/frontend/binary/target identity·자료
      경로/digest. web-ui-acceptance.md가 상세 계약이며 Seed QA와 제품 live 통과는 별도다.
    required: true
evaluation_principles:
