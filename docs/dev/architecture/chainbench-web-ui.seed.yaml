  description: All session-settled requirements are satisfied.
  criteria: WEB-01–14의 필수 시나리오와 구조화된 성공 계약이 모두 검증된다. 필수 live skip·mock-only·이전 실행 증거는 미완료이며 Seed 모델/문서 QA 통과는
    제품 완료를 의미하지 않는다.
