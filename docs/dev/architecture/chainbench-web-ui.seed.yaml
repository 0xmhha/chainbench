constraints:
- 프로젝트 루트는 /Users/0xtopaz/work/github/0xmhha/chainbench이며 기준 커밋은 9923df85a8d11f2c20e47d2e215d4209500af28a이다.
  Web 동작 명세 docs/dev/web-ui-spec.md와 API 계약 docs/dev/web-ui.openapi.yaml을 함께 구현하며 AST 분석 근거는 .ouroboros/web-ui-analysis/source-graph.json이다.
- 기존 Go 실행 엔진과 internal/app 유스케이스 및 Svelte Web을 재사용한다. UI는 Codex가 디자인한다. 엔진이 제공하는 문법·어휘·필수/선택 인자·허용값·범위·기본값을
  공통 계약으로 노출하고 UI와 서버가 같은 검증을 사용한다. 자유 입력은 계약이 허용하는 이름·주소·숫자 등에 한한다.
- 개인 PC와 팀 공용 서버를 모두 지원한다. 자체 계정 로그인과 최초 관리자 설정을 사용하고 관리자·운영자·조회자를 구분한다. 관리자는 운영자 기능을 포함한다. 조회자는 읽기만 가능하고 사용자
  관리·히스토리 삭제는 관리자만 가능하다.
- 설정과 실행 체인은 팀 공유이며 SSH 자격증명은 사용자별 비공개이다. 서버는 구성·작업·결과와 암호화된 개인 자격증명을 저장하며 기본 데이터 위치는 실행 디렉터리의 chainbench-out/web-ui이다.
  공유 import/export·로그·API에 비밀정보를 노출하지 않는다. 원격 제어는 실행자의 본인 자격증명과 실제 호스트 접근 권한을 요구한다.
- 현행 DSL 파서/스키마 및 내장 동작·단언·리더·인자 전체를 구조화 편집하고 import/export 의미를 보존한다. 기준 커밋의 지원 목록과 커버리지를 검증한다. 미등록 확장은 누락·의미
  변경 없이 오류 또는 지원 불가로 표시한다. 새 DSL 문법과 새 플러그인 구현 설치는 범위 밖이며 외부 매니페스트는 이미 지원하는 엔진 계열만 사용한다.
- 브라우저 종료·연결 끊김·로그아웃에도 작업은 지속되고 재접속 시 상태·결과를 복원한다. UI 서버 재시작 시 진행 중 작업을 중단으로 기록하고 실제 노드 상태를 확인하며 자동 재실행하지 않는다.
  작업 취소는 실행자·관리자만 가능하다.
- 테스트 종료 및 일반 취소 후 노드 유지/정리는 실행 전에 선택하며 기본 유지이다. 계정 비활성화·SSH 자격증명 삭제에 따른 취소는 노드 보존이 우선이고 철회된 자격증명으로 후속 정리를
  수행하지 않는다. 완료된 원격 변경은 자동 롤백하지 않으며 부분 실행·미완료 정리를 기록한다. attach 노드는 소유권·기능 계약에 따라 제어를 거절한다.
- 동일한 실제 호스트·노드·프로세스·데이터 경로·포트를 사용하는 충돌 요청은 workspace 이름이 달라도 차단하고 현재 작업과 실행자를 표시한다. 실제 자원이 독립된 작업만 병행하고 테스트에
  정의된 노드 제어는 해당 작업 소유 범위에서 수행한다.
- 실행·노드 상태, 이벤트, 노드별 metric 차트와 시점 연계 로그를 제공한다. 이벤트 누락·재접속·stale·수집 실패·집계 범위를 표시하고 상태 스냅샷을 기준으로 복원한다. 별도 Prometheus/Grafana
  서버를 필수 의존성으로 도입하지 않는다.
- 검색·필터·상세 결과·호환 실행 비교·결과 내보내기를 지원한다. 결과와 수집된 metric·로그는 자동 만료 없이 보관하며 관리자 삭제는 연결된 실행 자료만 제거하고 살아 있는 노드 데이터는
  제거하지 않는다.
- 기존 CLI/MCP·DSL v1 마이그레이션/v2·세션 아티팩트 및 기존 읽기 API 계약을 유지한다. Web 제어 요청은 인증·권한·감사 기록을 적용하며 CLI/MCP의 노드 유지 기본값을
  Web 기본값 때문에 변경하지 않는다. SPA는 internal/dashboard/spa에 빌드되어 실제 Go 임베드에서 제공되어야 한다.
- 실제 로컬 및 전용 SSH 인수 테스트를 Codex가 준비·실행한다. fixture 소스는 tests/webui, 런타임 루트는 /private/tmp/chainbench-web-ui-e2e이다.
  인접 /Users/0xtopaz/work/github/0xmhha/chain의 바이너리는 체인·OS·아키텍처를 검증하고 필요 시 호환 바이너리를 준비한다. 기존 외부 운영 서버는 가정하지
  않는다. 프론트/브라우저 검증 도구를 먼저 만들고 make check, go test -race ./..., go vet -tags e2e ./..., npm --prefix web run
  build 및 로컬/SSH 인수 검증을 완료한다. 필수 검증의 skip·mock만으로 완료를 판정하지 않는다.
- docs/chain-analysis의 세 체인 × 네 산출물을 versioned ChainSurface로 연결한다. 명령 경로·위치 인자·global/local scope·숨김/부재·OptionKey·schema·제약·출처를
  보존한다. 실행 선택지는 실제 바이너리 지원과 현행 엔진 mapping 및 작업 capability의 교집합이다. basename으로 wbft/wemix를 식별하지 않는다. 전체 바이너리
  CLI의 새 엔진 지원이나 raw command/argv 우회는 추가하지 않는다.
- 체인 문서의 커밋/캡처 시각/digest와 선택 Asset의 checksum·version·체인/OS/아키텍처·family/dialect를 검증한다. stale이면 해당 바이너리의 안전한
  help/probe 증거로 실행에 필요한 매핑을 재검증한다. 계획의 chainSurfaces fingerprint 변경은 실행 전 재검증을 요구한다. RPC/metric 수집은 rpc-metrics-graph와
  실제 자료를 대조한다.
- 구현은 tests/webui/verify.sh와 전용 fixture 준비/해제 및 결과 검증기를 먼저 만든다. 각 verify_command는 docs/dev/web-ui-acceptance.md의
  필수 시나리오를 실제 실행하고 이번 invocation의 result.json·evidence.json을 생성한다. exit 0·output_assertion·아티팩트 존재만으로 충분하지
  않으며 필수 집합 실행, skip/실패 0, 실제 build/binary/target 근거와 digest를 검증해야 한다.
