        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - *id003
      - *id004
    post:
      operationId: createCredential
      summary: Store an encrypted private credential
      x-minimum-role: operator
      responses:
        '201':
          description: Store an encrypted private credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreate'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/credentials/{credentialId}:
    get:
      operationId: getCredential
      summary: Read own metadata, never secret material
      x-minimum-role: operator
      responses:
        '200':
          description: Read own metadata, never secret material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: credentialId
        in: path
        required: true
        schema: *id002
    delete:
      operationId: revokeCredential
      summary: Revoke own credential and cancel related jobs while retaining nodes
      x-minimum-role: operator
      responses:
        '204':
          description: Revoke own credential and cancel related jobs while retaining
            nodes
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: credentialId
        in: path
        required: true
        schema: *id002
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/credentials/{credentialId}/check:
    post:
      operationId: checkCredential
      summary: Check own credential against a registered target
      x-minimum-role: operator
      responses:
        '200':
          description: Check own credential against a registered target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
