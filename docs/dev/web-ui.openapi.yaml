openapi: 3.1.0
info:
  title: chainbench Web UI API
  version: 1.0.0
  description: Implementation contract for docs/dev/web-ui-spec.md. Endpoint definitions
    are specified, not a claim of implementation. Engine grammar and vocabulary schemas
    are runtime-owned.
servers:
- url: /
  description: Same-origin dashboard service
security:
- sessionCookie: []
x-baseline-commit: 9923df85a8d11f2c20e47d2e215d4209500af28a
x-specification: web-ui-spec.md
paths:
  /api/v1/bootstrap:
    post:
      operationId: bootstrap
      summary: Initialize the first administrator once
      x-minimum-role: public
      responses:
        '201':
          description: Initialize the first administrator once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bootstrap'
      security: []
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Create a login session
      x-minimum-role: public
      responses:
        '200':
          description: Create a login session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Invalidate browser session without cancelling jobs
      x-minimum-role: viewer
      responses:
        '204':
          description: Invalidate browser session without cancelling jobs
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: &id001
          type: string
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: Read current session
      x-minimum-role: viewer
      responses:
        '200':
          description: Read current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List managed users
      x-minimum-role: administrator
      responses:
        '200':
          description: List managed users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - &id003
        name: cursor
        in: query
        required: false
        schema: *id001
      - &id004
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
    post:
      operationId: createUser
      summary: Register a team user
      x-minimum-role: administrator
      responses:
        '201':
          description: Register a team user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/users/{userId}:
    patch:
      operationId: updateUser
      summary: Update role or active state; deactivation cancels related jobs
      x-minimum-role: administrator
      responses:
        '200':
          description: Update role or active state; deactivation cancels related jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      parameters:
      - name: userId
        in: path
        required: true
        schema: &id002
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9_.-]+$
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/vocabulary:
    get:
      operationId: vocabulary
      summary: Read actual engine vocabulary and contract references
      x-minimum-role: viewer
      responses:
        '200':
          description: Read actual engine vocabulary and contract references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vocabulary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/contracts/{contractId}:
    get:
      operationId: contract
      summary: Read engine-owned grammar or parameter schema
      x-minimum-role: viewer
      responses:
        '200':
          description: Read engine-owned grammar or parameter schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonSchema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: contractId
        in: path
        required: true
        schema: *id002
  /api/v1/chains/{chainId}/surface:
    get:
      operationId: chainSurface
      summary: Read command/option catalog with engine support and binary provenance
      x-minimum-role: viewer
      responses:
        '200':
          description: Read command/option catalog with engine support and binary
            provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainSurface'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Without assetId returns documented baseline for draft editing.
        With assetId checks the selected binary and merges versioned evidence. Binary
        acceptance alone does not make a command/option executable. Hidden registration
        and command-local scope require explicit evidence. Plans require verified
        fingerprints for each binary; stale or incompatible evidence cannot authorize
        execution. Schema references expose engine-owned types, defaults, allowed
        values and prerequisites, never inferred allowlists.
      parameters:
      - name: chainId
        in: path
        required: true
        schema: *id002
      - name: assetId
        in: query
        required: false
        schema: *id002
  /api/v1/credentials:
    get:
      operationId: listCredentials
      summary: List only own credential metadata
      x-minimum-role: operator
