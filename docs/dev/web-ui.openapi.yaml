      required:
      - id
      - commandPath
      - summary
      - engineUsecases
      - support
    ChainOption:
      type: object
      properties:
        id: *id002
        optionKey: *id001
        spelling: *id001
        aliases:
          type: array
          items: *id001
        commandPath:
          type: array
          items: *id001
        scope:
          type: string
          enum:
          - global
          - command-local
        boolean: *id011
        hidden: *id011
        schemaRef: *id001
        contractId: *id002
        emission:
          type: string
          enum:
          - user-input
          - derived
          - private-binding
          - unmapped
        support:
          $ref: '#/components/schemas/SurfaceSupport'
      additionalProperties: false
      required:
      - id
      - spelling
      - aliases
      - commandPath
      - scope
      - boolean
      - hidden
      - emission
      - support
      if:
        properties:
          support:
            properties:
              selectable:
                const: true
      then:
        required:
        - optionKey
        - schemaRef
        - contractId
        properties:
          emission:
            const: user-input
    ChainSurface:
      type: object
      properties:
        chainId: *id002
        dialect: *id001
        contractVersion: *id001
        fingerprint: *id001
        verification:
          type: string
          enum:
          - documented
          - verified
          - stale
          - incompatible
          - unverified
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SurfaceSource'
        binary:
          $ref: '#/components/schemas/BinaryFingerprint'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/ChainCommand'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ChainOption'
        limitations:
          type: array
          items: *id001
      additionalProperties: false
      required:
      - chainId
      - dialect
      - contractVersion
      - fingerprint
      - verification
      - sources
      - commands
      - options
      - limitations
      if:
        properties:
          verification:
            const: verified
      then:
        required:
        - binary
        properties:
          binary:
            required:
            - verifiedAt
    ChainSurfaceRef:
      type: object
      properties:
        chainId: *id002
        assetId: *id002
        fingerprint: *id001
        contractVersion: *id001
      additionalProperties: false
      required:
      - chainId
      - assetId
      - fingerprint
      - contractVersion
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session/token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, ownership or host access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Revision, plan, idempotency or physical-resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Engine grammar, field, reference or capability validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Server failure; details remain redacted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
