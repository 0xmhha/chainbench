        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCheck'
      parameters:
      - name: credentialId
        in: path
        required: true
        schema: *id002
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/assets:
    get:
      operationId: listAssets
      summary: List registered shared files and binaries
      x-minimum-role: viewer
      responses:
        '200':
          description: List registered shared files and binaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - *id003
      - *id004
    post:
      operationId: uploadAsset
      summary: Upload and inspect a registered asset
      description: Register an immutable shared file with an ID and SHA-256 checksum.
        Binary files are limited to 256 MiB and undergo native OS/architecture,
        version and help inspection. Other files are limited to 16 MiB and currently
        support JSON/YAML declarations, JSON ABI and hexadecimal bytecode. Shared
        assets reject known credential fields and private key material. File format
        inspection alone does not imply execution compatibility.
      x-minimum-role: operator
      responses:
        '201':
          description: Upload and inspect a registered asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - binary
                  - configuration
                  - template
                  - material
                file:
                  type: string
                  format: binary
              additionalProperties: false
              required:
              - kind
              - file
  /api/v1/assets/{assetId}:
    get:
      operationId: getAsset
      summary: Read asset metadata and compatibility
      x-minimum-role: viewer
      responses:
        '200':
          description: Read asset metadata and compatibility
          content:
