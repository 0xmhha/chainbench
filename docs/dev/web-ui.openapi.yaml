          application/json:
            schema:
              $ref: '#/components/schemas/DocumentImport'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/documents/import/commit:
