        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/documents/import:
    post:
      operationId: previewImport
      summary: Parse import, preserve source and isolate sensitive bindings privately
      x-minimum-role: operator
      responses:
        '200':
          description: Parse import, preserve source and isolate sensitive bindings
