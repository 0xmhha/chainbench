        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - *id003
      - *id004
      - name: kind
        in: query
        required: false
        schema: &id012
          type: string
          enum:
          - chain-preset
          - server-set
          - workspace-config
          - manifest
          - case
          - run-definition
      - name: search
        in: query
        required: false
        schema: *id001
    post:
      operationId: createDocument
      summary: Validate and save a shared declaration
      x-minimum-role: operator
      responses:
        '201':
          description: Validate and save a shared declaration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema: *id001
        description: Required for cookie-authenticated changes; publisher bearer ingestion
          uses its own authentication.
  /api/v1/documents/validate:
