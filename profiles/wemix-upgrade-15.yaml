    - "0xe53b3f072caecd7b0363eb19510933f8d5d8f053"
    - "0xec56aa4111fb561bb5c2153ea7f5d6d8bd2497b6"
    - "0xa1b291a8cf1b5470db39f8f34b4924c38954cdef"
    - "0x45e828f0f349837c9754a7ca558ace4aa187149f"
    - "0xb511bc22714eb72d0b4b972530c82147bfe83792"
    - "0xbb5598808ba0b1585439a30637f0b3d81a809ecb"
    - "0xfa119c06d02e63879a7d8652beb84a137bff6908"
  stake: "2000000000000000000000000000"
  governance:
    ballot_duration_min: 86400
    ballot_duration_max: 604800
    staking_min: "1500000000000000000000000"
    staking_max: "1500000000000000000000000000"
    max_idle_block_interval: 5
    block_creation_time: 1000
    block_reward_amount: "1000000000000000000"
    max_priority_fee_per_gas: "100000000000"
    reward_distribution: [4000, 1000, 2500, 2500]
    max_base_fee: "50000000000000"
    block_gas_limit: 105000000
    base_fee_max_change_rate: 55
    gas_target_percentage: 30

# To-chain post-fork validator set: the croissant.init validators the successor
# chain rotates production across. Aligned lists.
#
# extra_data is absent because in a handoff it has no effect at all. Only the
# `config.croissant` section is lifted out of the wbft genesis and merged into the
# wemix one (plan.go step 1-2); the wbft genesis's top-level extraData is
# discarded with the rest of it, and the merged file keeps the wemix template's.
# Measured on the live 15+15 run: the merged genesis.json carries the wemix
# extraData ("chainbench handoff…", 149 bytes), while the post-fork validator set
# reaches the chain through croissant.init.validators + blsPublicKeys — 15 entries,
# substituted from the lists below. Setting extra_data here would encode the set a
# second time into a field nothing reads.
