data:
  directory: /tmp/wemix-upgrade-15

# Ports are the single-host fallback. With --server/--all-servers the nodes draw
# their host and port band from the server set instead, which is what puts two
# nodes on each of 15 servers.
ports:
  base_p2p: 30010
  step_p2p: 10
  base_rpc: 40010
  step_rpc: 10

nodes:
  verbosity: 4
  gcmode: archive
  cache: 2048
