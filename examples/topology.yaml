# Example per-node topology for `chainbench chain place|up --topology`.
#
# It replaces the `--bp N --en M --pn K` counts with an explicit, per-node
# layout: which node index plays which role, its sync mode, and which node is
# the bootnode. One consistent rule sets up the test
# environment, and the resulting node table is recorded in the workspace so the
# running network's shape is inspectable (chainbench chain show / status).
#
#   chainbench chain up --topology examples/topology.yaml --binary <path>
#
# role:      bp  (block producer; at least one)
#            en  (non-producing RPC node)
#            pn  (proxy tier)
# sync_mode: full (default) | snap | archive — honored for en only; a bp
#            always runs full
# bootnode:  at most one node may set this true
# index:     a contiguous 1..N set
chain: wbft
network: local
nodes:
  - { index: 1, role: bp, sync_mode: full }              # producer
  - { index: 2, role: en, sync_mode: full, bootnode: true } # full endpoint + bootnode
  - { index: 3, role: en, sync_mode: archive }           # archive endpoint
  - { index: 4, role: bp, sync_mode: full }              # producer
